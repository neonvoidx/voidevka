name: build and cache

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: neonvoidx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build font
        run: nix build -L

      - name: Push to Cachix
        uses: cachix/cachix-action@v15
        with:
          name: neonvoidx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ./result
