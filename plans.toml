[buildPlans.IosevkaVoidevkaMono]
family = "Voidevka Mono"
spacing = "normal"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

  [buildPlans.IosevkaVoidevkaMono.variants]
  inherits = "ss14"

    [buildPlans.IosevkaVoidevkaMono.variants.design]
    brace = "curly-flat-boundary"
    guillemet = "straight"
    at = "threefold"
    dollar = "interrupted"
    cent = "bar-interrupted"
    percent = "rings-segmented-slash"
    question = "corner"
    lig-ltgteq = "flat"
    lig-neq = "vertical-dotted"
    lig-double-arrow-bar = "without-notch"
    lig-single-arrow-bar = "without-notch"

[buildPlans.IosevkaVoidevkaMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaVoidevkaMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaVoidevkaMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaVoidevkaMono.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
